on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string

jobs:
  build:
    outputs:
      image: ${{ steps.vars.outputs.image }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set variables
        id: vars
        run: |
          tag=$(git show -s --format=%cd-%h --date=format:%Y%m%d%H%M%S)
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${{ github.repository }}-${{ inputs.app }}:$tag" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ inputs.app }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: ${{ inputs.app }}
          file: ${{ inputs.app }}/Dockerfile.prod
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.output.labels }}
          push: true
      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ inputs.app }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
